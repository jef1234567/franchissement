urM:null,mlc:null,mlcSource:null,sources:["Wikipédia FR — Renault TRM 700-100 — https://fr.wikipedia.org/wiki/Renault_TRM_700-100","MilitaryLeak — Soframe SRPB semi-trailer tank carrier (2018) — https://militaryleak.com/2018/07/11/soframe-srpb-semi-trailer-tank-carrier","TankNutDave — The French Renault TRM 700-100 tank transporter — https://tanknutdave.com/the-french-renault-trm-700-100-tank-transporter","Assemblée nationale, QE 4412 (JO 03/07/2018) — parc TRM 700/100 et PCM SISU — https://www.assemblee-nationale.fr/dyn/15/questions/QANR5L15QE4412.pdf"],notes:"Wikipédia FR : ensemble ~21 m, 9 essieux (tracteur 6x6 + semi 6 essieux dont 3 directeurs), PV ensemble 37 t, PTRA 98 t. Largeur = semi-remorque SRPB 3,35 m (MilitaryLeak). Hauteur et charge par essieu non publiées. 112 tracteurs TRM 700/100 en parc fin 2017 (AN QE 4412). Le parc compte aussi des ensembles porte-char SISU (PCM SISU, 107 en 2017) : aucune donnée technique trouvée."},{id:"pc_trm700_srpb_leclerc",nom:"Porte-char TRM 700-100 + SRPB + Leclerc chargé",propulsion:"roues",nouveau:!0,essieux:9,masseVideT:null,masseChargeT:100,chargeEssieuMaxT:null,longueurM:21,largeurM:3.6,hauteurM:null,mlc:null,mlcSource:null,sources:["Wikipédia FR — Renault TRM 700-100 — https://fr.wikipedia.org/wiki/Renault_TRM_700-100","MilitaryLeak — Soframe SRPB semi-trailer tank carrier (2018) — https://militaryleak.com/2018/07/11/soframe-srpb-semi-trailer-tank-carrier","Le char Leclerc XLR rénové — https://www.defense.gouv.fr/terre/nos-materiels/nos-equipements-terre/vehicules-larmee-terre/vehicules-chars-bataille/char-leclerc-xlr-renove","TankNutDave — The French Renault TRM 700-100 tank transporter — https://tanknutdave.com/the-french-renault-trm-700-100-tank-transporter"],notes:"HYPOTHÈSE CALCULÉE : 37 t (ensemble à vide) + 63 t (Leclerc, valeur haute ministère) = 100 t, soit au-delà du PTRA publié (98 t) ; avec un Leclerc à 56-57 t : 93-94 t. TankNutDave : 6,6 ch/t pour 700 ch -> ~106 t (estimation, non publiée). Largeur =
