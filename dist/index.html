eux (tracteur 6x6 + semi 6 essieux dont 3 directeurs), PV ensemble 37 t, PTRA 98 t. Largeur = semi-remorque SRPB 3,35 m (MilitaryLeak). Hauteur et charge par essieu non publiées. 112 tracteurs TRM 700/100 en parc fin 2017 (AN QE 4412). Le parc compte aussi des ensembles porte-char SISU (PCM SISU, 107 en 2017) : aucune donnée technique trouvée."},{id:"pc_trm700_srpb_leclerc",nom:"Porte-char TRM 700-100 + SRPB + Leclerc chargé",propulsion:"roues",nouveau:!0,essieux:9,masseVideT:null,masseChargeT:100,chargeEssieuMaxT:null,longueurM:21,largeurM:3.6,hauteurM:null,mlc:null,mlcSource:null,sources:["Wikipédia FR — Renault TRM 700-100 — https://fr.wikipedia.org/wiki/Renault_TRM_700-100","MilitaryLeak — Soframe SRPB semi-trailer tank carrier (2018) — https://militaryleak.com/2018/07/11/soframe-srpb-semi-trailer-tank-carrier","Le char Leclerc XLR rénové — https://www.defense.gouv.fr/terre/nos-materiels/nos-equipements-terre/vehicules-larmee-terre/vehicules-chars-bataille/char-leclerc-xlr-renove","TankNutDave — The French Renault TRM 700-100 tank transporter — https://tanknutdave.com/the-french-renault-trm-700-100-tank-transporter"],notes:"HYPOTHÈSE CALCULÉE : 37 t (ensemble à vide) + 63 t (Leclerc, valeur haute ministère) = 100 t, soit au-delà du PTRA publié (98 t) ; avec un Leclerc à 56-57 t : 93-94 t. TankNutDave : 6,6 ch/t pour 700 ch -> ~106 t (estimation, non publiée). Largeur = Leclerc 3,6 m (dépasse la plateforme 3,35 m). Longueur : Leclerc canon vers l'avant peut dépasser du plateau — non publié. Hauteur non publiée (plateau + 3,43 m)."},{id:"srpb",nom:"Semi-remorque porte-blindés SRPB (Soframe)",propulsion:"roues",nouveau:!0,essieux:6,masseVideT:19.5,masseChargeT:81,chargeEssieuMaxT:null,longueurM:15.22,largeurM:3.35,hauteurM:null,mlc:null,mlcSource:null,sources:["MilitaryLeak — Soframe SRPB semi-trailer tank carrier (2018) — https://militaryleak.com/2018/07/11/soframe-srpb-semi-trailer-tank-carrier","Soframe — plaquette générale (SRPB 40 à 70 t) — https://soframe.com//uploads/2022/05/D3063D-Plaquette-generale-Soframe-FR-w.pdf"],notes:"MilitaryLeak : 6 essieux (3 arrière directeurs), PV 19,5 t, charge utile 60 t, PTAC 81 t, L 15,22 m, plateau 10,94 m, l 3,35 m. Soframe : gamme SRPB 40 à 70 t (version SRPB 70 non détaillée). Semi seule, à combiner avec un tracteur."},{id:"vbhp",nom:"VBHP (Aravis)",propulsion:"roues",nouveau:!0,essieux:2,masseVideT:null,masseChargeT:12.5,chargeEssieuMaxT:null,longueurM:6,largeurM:2.5,hauteurM:2.5,mlc:null,mlcSource:null,sources:["Wikipédia EN — Nexter Aravis — https://en.wikipedia.org/wiki/Nexter_Aravis"],notes:"Wikipédia EN (dernier recours) : 12,5 t (empty/GVW non précisé), 6 × 2,5 × 2,5 m ; 15 Aravis en service sous l'appellation VBHP (Génie, ouverture d'itinéraire). Pas de fiche ministère trouvée. 4x4."},{id:"sprat",nom:"SPRAT (ponteur chargé)",propulsion:"roues",nouveau:!0,essieux:5,masseVideT:null,masseChargeT:58,chargeEssieuMaxT:null,longueurM:17.38,largeurM:4,hauteurM:4.05,mlc:null,mlcSource:null,sources:["SPRAT (ministère) — https://www.defense.gouv.fr/terre/nos-materiels/nos-equipements-terre/vehicules-larmee-terre/vehicules-equipement-du-genie/sprat-systeme-pose","Fiche SPRAT (ministère, archives) — https://archives.defense.gouv.fr/content/download/186394/2053611/sprat.pdf","Communiqué DGA — 5 SPRAT livrés (ponteur 5 essieux 10x10) — https://archives.defense.gouv.fr/content/download/168880/1821955/CP%20DGA%205%20SPRAT%20livr%c3%a9s.pdf","CNIM — Enhanced operational performance for French Army's SPRAT — https://cnim-systemes-industriels.com/en/enhanced-operational-performance-french-armys-sprat-bridging-systems"],notes:"Ministère : L hors tout en charge 17,38 m (fiche archive : 17,30 m), l 4,00 m avec 1 ou 2 travures, H 4,05 m tout chemin (archive : 4,00 m) ; fiche archive : 58 t. DGA : ponteur 5 essieux (10x10) ; porte-travures supplémentaires = tracteur 6x6 + semi (données non publiées). Les classes MLC 70 / 85T-120W / 100T-150W publiées par CNIM sont celles du PONT, pas du véhicule ->
